name: Focana CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop unit and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Desktop Unit Tests
        run: npm run test:desktop

      - name: Build Renderer
        run: npm run build:renderer

  web:
    name: Web test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci --prefix web

      - name: Run Web Tests
        run: npm run test:web

      - name: Build Web
        run: npm run build:web

  electron-e2e-diagnostic:
    name: Electron E2E diagnostic
    needs: desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Renderer
        run: npm run build:renderer

      - name: Check Electron Launch
        id: electron_launch
        continue-on-error: true
        run: >-
          xvfb-run -a env FOCANA_E2E=1 FOCANA_E2E_BACKGROUND=1
          npx playwright test tests/e2e/electron-flows.spec.js
          --grep "app starts with analytics disabled and emits no PostHog warnings"

      - name: Run Electron E2E
        id: electron_suite
        if: steps.electron_launch.outcome == 'success'
        continue-on-error: true
        run: xvfb-run -a env FOCANA_E2E=1 FOCANA_E2E_BACKGROUND=1 npx playwright test

      - name: Report Electron E2E Diagnostic
        if: steps.electron_launch.outcome == 'failure' || steps.electron_suite.outcome == 'failure'
        run: >-
          echo "::warning::Electron E2E is diagnostic-only while the GitHub runner launch failure is repaired.
          Desktop unit tests and the renderer build remain required gates."
